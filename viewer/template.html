<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flashcards">
<meta name="theme-color" content="#1f2937">
<title>Flashcards</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f5f4;
    --surface: #ffffff;
    --text: #1c1917;
    --muted: #78716c;
    --accent: #2563eb;
    --mark: #f59e0b;
    --border: #d6d3d1;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1c1917;
      --surface: #292524;
      --text: #f5f5f4;
      --muted: #a8a29e;
      --accent: #60a5fa;
      --mark: #fbbf24;
      --border: #44403c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1c1917;
    --surface: #292524;
    --text: #f5f5f4;
    --muted: #a8a29e;
    --accent: #60a5fa;
    --mark: #fbbf24;
    --border: #44403c;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  button, select, input { font: inherit; color: inherit; }
  button {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    min-height: 44px;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, select:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.marked { border-color: var(--mark); color: var(--mark); font-weight: 600; }

  header {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    justify-content: space-between; padding: 12px 0;
  }
  header h1 { font-size: 1.1rem; margin: 0; }
  .header-right { display: flex; gap: 12px; align-items: center; }
  .progress { color: var(--muted); font-variant-numeric: tabular-nums; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  select {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px; min-height: 44px; max-width: 100%;
  }
  label.toggle { display: inline-flex; gap: 6px; align-items: center; min-height: 44px; }

  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  .card {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    display: flex; flex-direction: column;
    text-align: center;
    min-height: 320px;
    cursor: pointer;
    user-select: none;
    position: relative;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .card.is-marked { border-color: var(--mark); box-shadow: 0 0 0 2px var(--mark) inset; }
  .meta { color: var(--muted); font-size: .85rem; margin-bottom: 12px; padding: 0 30px; }
  .side-label {
    color: var(--muted); font-size: .75rem; text-transform: uppercase;
    letter-spacing: .08em; margin-bottom: 8px;
  }
  .face-text { font-size: 1.9rem; line-height: 1.35; overflow-wrap: anywhere; }
  .answer-line { margin: 0 0 .5em; }
  .hint { margin-top: auto; padding-top: 16px; color: var(--muted); font-size: .85rem; }
  .card img {
    display: block; max-width: 100%; height: auto; margin: 14px auto 0;
    border-radius: 8px; background: #fff;
  }
  .star {
    position: absolute; top: 14px; right: 16px; font-size: 1.4rem;
    color: var(--mark); display: none;
  }
  .card.is-marked .star { display: block; }

  .nav { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 14px 0; }
  .nav button { font-size: 1.05rem; }
  .mid { text-align: center; }

  footer {
    border-top: 1px solid var(--border); padding: 14px 0 20px; margin-top: 8px;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
  }
  footer .group { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .keys { color: var(--muted); font-size: .8rem; }
  input[type="file"] { display: none; }

  #toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom));
    transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s;
    pointer-events: none; max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; }

  @media (max-width: 600px) {
    body { font-size: 16px; }
    .face-text { font-size: 1.6rem; }
    .card { min-height: 280px; padding: 16px; }
    .keys { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Flashcards</h1>
  <div class="header-right">
    <span class="progress" id="progress"></span>
    <button id="themeBtn" aria-label="Switch between light and dark mode"></button>
  </div>
</header>

<div class="controls">
  <select id="lecture" aria-label="Filter by lecture"></select>
  <label class="toggle"><input type="checkbox" id="markedOnly"> Marked only</label>
  <label class="toggle"><input type="checkbox" id="shuffle"> Shuffle</label>
</div>

<main>
  <div class="card" id="card" role="button" tabindex="0" aria-label="Flip card">
    <span class="star" aria-hidden="true">★</span>
    <div class="meta" id="meta"></div>
    <div class="side-label" id="sideLabel">Question</div>
    <div class="face-text" id="faceText"></div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="nav">
    <button id="prev" aria-label="Previous card">← Prev</button>
    <button id="flip" class="primary">Show answer</button>
    <button id="next" aria-label="Next card">Next →</button>
  </div>
  <div class="mid">
    <button id="markBtn">★ Mark as difficult</button>
  </div>
</main>

<footer>
  <div class="group">
    <button id="exportBtn">Export marks</button>
    <button id="importBtn">Import marks</button>
    <input type="file" id="importFile" accept="application/json,.json">
    <button id="clearBtn">Clear marks</button>
  </div>
  <span class="keys">Keys: ← → navigate · Space flip · M mark</span>
</footer>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  // Filled in by build.py: the markdown files as they were at build time.
  const SOURCES = /*__SOURCES__*/[];

  const MARKS_KEY = "flashcards:marks:v1";
  const THEME_KEY = "flashcards:theme:v1";

  const LECTURE_RE = /^##\s+(.+?)\s*:?\s*$/;
  const TOPIC_RE = /^###\s+(.+?)\s*$/;
  const QUESTION_RE = /^\*\*(.+?):\*\*\s*$/;
  const IMAGE_RE = /!\[[^\]]*\]\(([^)]+)\)/;

  // ---------- parsing ----------
  function unescapeMd(s) {
    return s.replace(/\\(.)/g, "$1");
  }

  // Returns the cards in one markdown file.
  function parseSource(file, text) {
    const lines = text.split("\n");
    const cards = [];
    let lecture = "", topic = "", cur = null;

    function close() {
      if (cur) cards.push(cur);
      cur = null;
    }

    lines.forEach(function (rawLine) {
      const line = rawLine.trim();
      let m;
      if (!line.startsWith("###") && (m = line.match(LECTURE_RE))) {
        close(); lecture = m[1]; topic = ""; return;
      }
      if ((m = line.match(TOPIC_RE))) {
        close(); topic = m[1]; return;
      }
      if ((m = line.match(QUESTION_RE))) {
        close();
        cur = { file: file, question: unescapeMd(m[1]), lecture: lecture,
                topic: topic, answer: [], images: [] };
        return;
      }
      if (!cur || !line) return;
      const im = line.match(IMAGE_RE);
      if (im) { cur.images.push(im[1]); return; }
      cur.answer.push(unescapeMd(line));
    });
    close();
    return cards;
  }

  // SHA-1 of a UTF-8 string, as hex. Card ids use it so that marks saved by
  // earlier versions of the viewer still match their cards.
  function sha1Hex(str) {
    const bytes = new TextEncoder().encode(str);
    const bitLen = bytes.length * 8;
    const padded = new Uint8Array(((bytes.length + 9 + 63) >> 6) << 6);
    padded.set(bytes);
    padded[bytes.length] = 0x80;
    const dv = new DataView(padded.buffer);
    dv.setUint32(padded.length - 4, bitLen >>> 0);
    dv.setUint32(padded.length - 8, Math.floor(bitLen / 0x100000000));

    let h0 = 0x67452301, h1 = 0xEFCDAB89, h2 = 0x98BADCFE, h3 = 0x10325476, h4 = 0xC3D2E1F0;
    const w = new Uint32Array(80);
    for (let off = 0; off < padded.length; off += 64) {
      for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
      for (let i = 16; i < 80; i++) {
        const x = w[i - 3] ^ w[i - 8] ^ w[i - 14] ^ w[i - 16];
        w[i] = (x << 1) | (x >>> 31);
      }
      let a = h0, b = h1, c = h2, d = h3, e = h4;
      for (let i = 0; i < 80; i++) {
        let f, k;
        if (i < 20) { f = (b & c) | (~b & d); k = 0x5A827999; }
        else if (i < 40) { f = b ^ c ^ d; k = 0x6ED9EBA1; }
        else if (i < 60) { f = (b & c) | (b & d) | (c & d); k = 0x8F1BBCDC; }
        else { f = b ^ c ^ d; k = 0xCA62C1D6; }
        const t = (((a << 5) | (a >>> 27)) + f + e + k + w[i]) >>> 0;
        e = d; d = c; c = ((b << 30) | (b >>> 2)) >>> 0; b = a; a = t;
      }
      h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0;
      h3 = (h3 + d) >>> 0; h4 = (h4 + e) >>> 0;
    }
    return [h0, h1, h2, h3, h4].map(function (x) { return x.toString(16).padStart(8, "0"); }).join("");
  }

  // Every card gets an id: hash of its question plus how many times that
  // question has appeared so far.
  function buildCards(srcs) {
    const all = [];
    srcs.forEach(function (s) { all.push.apply(all, parseSource(s.file, s.text)); });
    const seen = new Map();
    all.forEach(function (c) {
      const n = (seen.get(c.question) || 0) + 1;
      seen.set(c.question, n);
      c.id = sha1Hex(c.question + "|" + n).slice(0, 12);
    });
    return all;
  }

  // ---------- state ----------
  const cards = buildCards(SOURCES);
  let order = [];         // cards currently in play, in display order
  let numberOf = new Map(); // card id -> its number within the lecture filter
  let deckSize = 0;       // how many cards the lecture filter contains
  let index = 0;          // position within `order`
  let flipped = false;    // showing the answer side?

  // ---------- storage (can be unavailable in private windows) ----------
  function loadMarks() {
    try {
      const raw = localStorage.getItem(MARKS_KEY);
      return new Set(raw ? JSON.parse(raw) : []);
    } catch (e) { return new Set(); }
  }
  function saveMarks() {
    try { localStorage.setItem(MARKS_KEY, JSON.stringify([...marks])); }
    catch (e) { toast("Couldn't save marks in this browser"); }
  }
  const marks = loadMarks();

  // ---------- DOM refs ----------
  const el = {
    lecture: document.getElementById("lecture"),
    markedOnly: document.getElementById("markedOnly"),
    shuffle: document.getElementById("shuffle"),
    card: document.getElementById("card"),
    meta: document.getElementById("meta"),
    sideLabel: document.getElementById("sideLabel"),
    faceText: document.getElementById("faceText"),
    hint: document.getElementById("hint"),
    progress: document.getElementById("progress"),
    markBtn: document.getElementById("markBtn"),
    prev: document.getElementById("prev"),
    next: document.getElementById("next"),
    flip: document.getElementById("flip"),
    themeBtn: document.getElementById("themeBtn"),
    exportBtn: document.getElementById("exportBtn"),
    importBtn: document.getElementById("importBtn"),
    importFile: document.getElementById("importFile"),
    clearBtn: document.getElementById("clearBtn"),
    toast: document.getElementById("toast"),
  };

  // ---------- helpers ----------
  function elem(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  // Answer lines with **bold** support. Built with DOM calls, never innerHTML.
  function renderAnswer(container, lines) {
    container.textContent = "";
    lines.forEach(function (line) {
      const p = elem("p", "answer-line");
      line.split(/\*\*(.+?)\*\*/).forEach(function (part, i) {
        if (!part) return;
        p.appendChild(i % 2 === 1 ? elem("strong", null, part) : document.createTextNode(part));
      });
      container.appendChild(p);
    });
  }

  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.toast.classList.remove("show"); }, 2600);
  }

  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function currentCard() { return order[index] || null; }

  // ---------- theme ----------
  function systemPrefersDark() {
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function currentTheme() {
    return document.documentElement.getAttribute("data-theme") || (systemPrefersDark() ? "dark" : "light");
  }
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    el.themeBtn.textContent = theme === "dark" ? "☀ Light" : "☾ Dark";
  }
  el.themeBtn.addEventListener("click", function () {
    const next = currentTheme() === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* not saved; fine */ }
  });
  try {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved === "light" || saved === "dark") applyTheme(saved);
    else applyTheme(currentTheme());
  } catch (e) {
    applyTheme(currentTheme());
  }

  // ---------- deck in play ----------
  // Numbers come from the lecture filter alone, so they restart in each
  // lecture and run 1..N across all cards. Marked-only and shuffle don't
  // change the numbers.
  function rebuildOrder(keepId, fallbackIndex) {
    const lec = el.lecture.value;
    const inLecture = lec === "" ? cards.slice() : cards.filter(function (c) { return c.lecture === lec; });
    numberOf = new Map(inLecture.map(function (c, i) { return [c.id, i + 1]; }));
    deckSize = inLecture.length;

    let list = inLecture.slice();
    if (el.markedOnly.checked) list = list.filter(function (c) { return marks.has(c.id); });
    if (el.shuffle.checked) shuffleArray(list);
    order = list;

    const keep = keepId ? order.findIndex(function (c) { return c.id === keepId; }) : -1;
    const fallback = Math.min(Math.max(fallbackIndex || 0, 0), Math.max(order.length - 1, 0));
    index = keep >= 0 ? keep : fallback;
    flipped = false;
  }

  function populateLectures() {
    const lectures = [];
    cards.forEach(function (c) { if (lectures.indexOf(c.lecture) === -1) lectures.push(c.lecture); });
    el.lecture.textContent = "";
    el.lecture.appendChild(new Option("All lectures (" + cards.length + ")", ""));
    lectures.forEach(function (lec) {
      const count = cards.filter(function (c) { return c.lecture === lec; }).length;
      el.lecture.appendChild(new Option((lec || "Unsorted") + " (" + count + ")", lec));
    });
  }

  // ---------- rendering ----------
  function render() {
    el.progress.textContent = order.length
      ? (index + 1) + " / " + order.length + " · ★ " + marks.size + " marked"
      : "★ " + marks.size + " marked";

    if (!order.length) {
      el.meta.textContent = "";
      el.sideLabel.textContent = "";
      el.faceText.textContent = el.markedOnly.checked
        ? "No marked cards yet. Mark cards with the ★ button or the M key."
        : "No cards to show.";
      el.hint.textContent = "";
      el.card.classList.remove("is-marked");
      el.card.style.cursor = "default";
      el.markBtn.disabled = true;
      el.prev.disabled = el.next.disabled = el.flip.disabled = true;
      return;
    }

    el.prev.disabled = el.next.disabled = el.flip.disabled = false;
    el.markBtn.disabled = false;
    el.card.style.cursor = "pointer";

    const card = currentCard();
    const isMarked = marks.has(card.id);
    el.card.classList.toggle("is-marked", isMarked);
    el.markBtn.textContent = isMarked ? "★ Marked (unmark)" : "★ Mark as difficult";
    el.markBtn.classList.toggle("marked", isMarked);

    const number = "Card " + numberOf.get(card.id) + " of " + deckSize;
    el.meta.textContent = [number, card.lecture, card.topic].filter(Boolean).join(" · ");
    el.flip.textContent = flipped ? "Show question" : "Show answer";

    el.faceText.textContent = "";
    el.card.querySelectorAll("img").forEach(function (img) { img.remove(); });

    if (!flipped) {
      el.sideLabel.textContent = "Question";
      el.faceText.textContent = card.question;
      el.hint.textContent = "Tap the card or press Space to reveal the answer";
    } else {
      el.sideLabel.textContent = "Answer";
      renderAnswer(el.faceText, card.answer);
      card.images.forEach(function (src) {
        const img = document.createElement("img");
        img.src = src;
        img.alt = "";
        img.loading = "lazy";
        el.card.insertBefore(img, el.hint);
      });
      el.hint.textContent = "Tap the card or press Space to see the question";
    }
  }

  // ---------- study actions ----------
  function go(delta) {
    if (!order.length) return;
    index = (index + delta + order.length) % order.length;
    flipped = false;
    render();
  }
  function flip() {
    if (!order.length) return;
    flipped = !flipped;
    render();
  }
  function toggleMark() {
    const card = currentCard();
    if (!card) return;
    if (marks.has(card.id)) marks.delete(card.id); else marks.add(card.id);
    saveMarks();
    if (el.markedOnly.checked) {
      // The card may have just left the list; keep the position stable.
      rebuildOrder(marks.has(card.id) ? card.id : null, index);
    }
    render();
  }

  function exportMarks() {
    const data = {
      app: "flashcards",
      version: 1,
      exported: new Date().toISOString(),
      marked: [...marks].sort(),
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "flashcard-marks-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast("Exported " + marks.size + " marks");
  }

  // Import MERGES with the marks already on this device.
  function importMarks(file) {
    const reader = new FileReader();
    reader.onload = function () {
      try {
        const data = JSON.parse(reader.result);
        const list = Array.isArray(data) ? data : data.marked;
        if (!Array.isArray(list)) throw new Error("no marks list");
        const before = marks.size;
        list.forEach(function (id) { if (typeof id === "string") marks.add(id); });
        saveMarks();
        rebuildOrder(currentCard() && currentCard().id, index);
        render();
        toast("Imported " + list.length + " marks (" + (marks.size - before) + " new)");
      } catch (e) {
        toast("That file isn't a valid marks export");
      }
    };
    reader.readAsText(file);
  }

  // ---------- events ----------
  let swiped = false;
  el.card.addEventListener("click", function () {
    if (swiped) { swiped = false; return; }
    flip();
  });
  el.card.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); flip(); }
  });
  el.prev.addEventListener("click", function () { go(-1); });
  el.next.addEventListener("click", function () { go(1); });
  el.flip.addEventListener("click", flip);
  el.markBtn.addEventListener("click", toggleMark);

  el.lecture.addEventListener("change", function () { rebuildOrder(); render(); });
  el.markedOnly.addEventListener("change", function () { rebuildOrder(); render(); });
  el.shuffle.addEventListener("change", function () { rebuildOrder(); render(); });

  el.exportBtn.addEventListener("click", exportMarks);
  el.importBtn.addEventListener("click", function () { el.importFile.click(); });
  el.importFile.addEventListener("change", function () {
    if (el.importFile.files[0]) importMarks(el.importFile.files[0]);
    el.importFile.value = "";
  });
  el.clearBtn.addEventListener("click", function () {
    if (!marks.size) { toast("No marks to clear"); return; }
    if (!confirm("Remove all " + marks.size + " marks from this device?")) return;
    marks.clear();
    saveMarks();
    rebuildOrder(currentCard() && currentCard().id, index);
    render();
    toast("Marks cleared on this device");
  });

  // Keyboard shortcuts (ignored while a control has focus).
  document.addEventListener("keydown", function (e) {
    const tag = (e.target && e.target.tagName) || "";
    if (/INPUT|SELECT|TEXTAREA/.test(tag) && e.target.type !== "checkbox") return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    switch (e.key) {
      case "ArrowRight": go(1); break;
      case "ArrowLeft": go(-1); break;
      case " ":
      case "ArrowUp":
      case "ArrowDown":
        if (e.target === el.card || e.target === document.body) { e.preventDefault(); flip(); }
        break;
      case "m": case "M": toggleMark(); break;
    }
  });

  // Swipe left/right on the card to move between cards.
  let touchX = null, touchY = null;
  el.card.addEventListener("touchstart", function (e) {
    swiped = false;
    touchX = e.touches[0].clientX;
    touchY = e.touches[0].clientY;
  }, { passive: true });
  el.card.addEventListener("touchend", function (e) {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    const dy = e.changedTouches[0].clientY - touchY;
    touchX = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      swiped = true;
      go(dx < 0 ? 1 : -1);
    }
  }, { passive: true });

  // ---------- start ----------
